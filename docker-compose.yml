services:
  backend:
    build: ./backend
    restart: always
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=sqlite:////app/data/alerts.db
    expose:
      - "8000"

  worker:
    build: ./backend
    restart: always
    command: python worker.py
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=sqlite:////app/data/alerts.db
      - POLYGON_RPC_URL=${POLYGON_RPC_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MIN_USD_THRESHOLD=${MIN_USD_THRESHOLD:-5000}
      - MAX_NONCE_THRESHOLD=${MAX_NONCE_THRESHOLD:-10}
      # Notifications are read from DB, but defaults use these if DB empty
      - NOTIFY_WHALES=${NOTIFY_WHALES:-true}
      - NOTIFY_SUSPICIOUS=${NOTIFY_SUSPICIOUS:-true}
    depends_on:
      - backend

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
